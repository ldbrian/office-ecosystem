<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>办公室生态缸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a06}
canvas{display:block;position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;g.mozImageSmoothingEnabled=false;g.webkitImageSmoothingEnabled=false;g.msImageSmoothingEnabled=false;
var W=1120,H=1440;
cv.width=W;cv.height=H;
function fit(){var r=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*r)+'px';cv.style.height=Math.floor(H*r)+'px';cv.style.left=Math.floor((innerWidth-W*r)/2)+'px';cv.style.top=Math.floor((innerHeight-H*r)/2)+'px';}
fit();window.addEventListener('resize',fit);

var now=new Date(),hh=now.getHours();
function dayF(){return hh>=7&&hh<20?1:.25}

// ===== 轴测投影 =====
// X/Y: Tile单位 (1格=80×40px菱形)
// Z: 像素高度
var ISO={tw:80,th:40};
var CX=W/2,CY=560;

function toS(x,y,h){
  return{
    x:CX+(x-y)*(ISO.tw/2),
    y:CY+(x+y)*(ISO.th/2)-h
  };
}

// ===== 房间 =====
var RW=10,RD=8;
var WALL_H=200;

// ===== 家具 (x,y Tile, h 像素) =====
var F={
  dL:{x:1,y:5,z:0,w:3,d:2,h:44},
  dR:{x:6,y:5,z:0,w:3,d:2,h:44},
  cL:{x:2,y:6.5,z:0},
  cR:{x:7,y:6.5,z:0},
  bs:{x:0.3,y:0.3,z:0,w:1.5,d:1,h:130},
  pr:{x:0.5,y:3.5,z:0,w:1.5,d:1,h:36},
  wc:{x:8.5,y:1,z:0,w:1,d:1,h:90},
  cf:{x:8.5,y:3,z:0,w:1,d:1,h:56},
  wb:{x:3,y:0,z:80,w:4,d:0.3,h:110},
  bul:{x:0.5,y:0,z:90,w:1.5,d:0.3,h:80},
  clk:{x:8,y:0,z:160},
  win:{x:5.5,y:0,z:40,w:2.5,d:0.3,h:140},
  pB:{x:1,y:7,z:0},
  pM:{x:8,y:7,z:0},
  pS1:{x:2.5,y:4.5,z:44},
  pS2:{x:7.5,y:4.5,z:44},
  tr:{x:4,y:7,z:0}
};

var ppl=[];
var plant={x:F.pB.x,y:F.pB.y,wilt:1,alive:false};
var imgCache={};
function loadImg(name,src){
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){imgCache[name]=img;resolve();};
    img.src=src;
  });
}

function init(){
  ppl=[
    {x:2,y:6,z:0,col:'#4088D8',hair:'#8B6B4A',desk:{x:2,y:5},st:'idle',act:'cG',tm:5000+Math.random()*3000,wt:0,wf:0,dir:1,cup:false},
    {x:7,y:6,z:0,col:'#E85040',hair:'#5A3A2A',desk:{x:7,y:5},st:'idle',act:'pG',tm:3000+Math.random()*2000,wt:0,wf:0,dir:-1,cup:false},
    {x:4,y:6,z:0,col:'#50A050',hair:'#3A2A1A',desk:{x:4,y:5.5},st:'idle',act:'idle',tm:99999,wt:0,wf:0,dir:1,cup:false},
    {x:5.5,y:3,z:0,col:'#E8B830',hair:'#6B4A2A',desk:{x:6,y:2.5},st:'idle',act:'idle',tm:99999,wt:0,wf:0,dir:-1,cup:false}
  ];
}

function tgt(p){
  var m={cG:{x:F.cf.x,y:F.cf.y+1},cB:{x:p.desk.x,y:p.desk.y+1},pG:{x:plant.x+0.5,y:plant.y+0.5},pB:{x:p.desk.x,y:p.desk.y+1}};
  return m[p.act]||{x:p.desk.x,y:p.desk.y+1};
}

function update(dt){
  for(var i=0;i<4;i++){
    var p=ppl[i];
    if(p.st==='walk'){
      var t=tgt(p),dx=t.x-p.x,dy=t.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<0.2){p.x=t.x;p.y=t.y;p.st='idle';p.tm=300+Math.random()*600;p.wt=0;}
      else{var sp=1.2;p.x+=dx/d*sp*dt/1000;p.y+=dy/d*sp*dt/1000;p.wt+=dt;if(p.wt>200){p.wt-=200;p.wf=(p.wf+1)%4;}}
      p.dir=dx>0?1:-1;
    }else if(p.st==='idle'){p.tm-=dt;if(p.tm<=0){p.st='walk';p.wt=0;}}
    else if(p.st==='drink'){p.tm-=dt;if(p.tm<=0){p.cup=false;p.act='cB';p.st='walk';p.wt=0;}else if(p.tm<1800)p.cup=true;}
    else if(p.st==='water'){p.tm-=dt;if(p.tm<=0){plant.wilt=Math.max(.15,plant.wilt-.35);p.act='pB';p.st='walk';p.wt=0;}}
    var t2=tgt(p);p.dir=t2.x>p.x?1:-1;
    var a=Math.abs(p.x-t2.x)<0.3&&Math.abs(p.y-t2.y)<0.3;
    if(a&&p.st==='walk'){
      if(p.act==='cG'){p.st='drink';p.tm=2600;p.cup=false;}
      else if(p.act==='cB'){p.st='idle';p.act='cG';p.tm=9000+Math.random()*10000;}
      else if(p.act==='pG'){p.st='water';p.tm=2600;}
      else if(p.act==='pB'){p.st='idle';p.act='pG';p.tm=7000+Math.random()*7000;}
    }
  }
  plant.wilt=Math.min(1,plant.wilt+dt*.000004);
  if(plant.wilt>=.97)plant.alive=false;
}

// ===== 轴测绘制 =====
// 顶面 + 左面 + 前面 (从顶部俯视可见的三个面)
function drawBlock(wx,wy,wz,bw,bd,bh,topC,leftC,frontC){
  var p=[];
  p[0]=toS(wx,wy,wz);       // 前左底
  p[1]=toS(wx+bw,wy,wz);    // 前右底
  p[2]=toS(wx+bw,wy+bd,wz); // 后右底
  p[3]=toS(wx,wy+bd,wz);    // 后左底
  p[4]=toS(wx,wy,wz+bh);    // 前左顶
  p[5]=toS(wx+bw,wy,wz+bh); // 前右顶
  p[6]=toS(wx+bw,wy+bd,wz+bh);// 后右顶
  p[7]=toS(wx,wy+bd,wz+bh); // 后左顶
  // 顶面
  g.fillStyle=topC;g.beginPath();
  g.moveTo(p[4].x,p[4].y);g.lineTo(p[5].x,p[5].y);
  g.lineTo(p[6].x,p[6].y);g.lineTo(p[7].x,p[7].y);g.fill();
  // 左面 (面向观众, y 大的一侧)
  g.fillStyle=leftC;g.beginPath();
  g.moveTo(p[0].x,p[0].y);g.lineTo(p[3].x,p[3].y);
  g.lineTo(p[7].x,p[7].y);g.lineTo(p[4].x,p[4].y);g.fill();
  // 前面 (面向观众, y 小的一侧)
  g.fillStyle=frontC;g.beginPath();
  g.moveTo(p[0].x,p[0].y);g.lineTo(p[1].x,p[1].y);
  g.lineTo(p[5].x,p[5].y);g.lineTo(p[4].x,p[4].y);g.fill();
}

function drawFloor(){
  for(var x=0;x<RW;x++)for(var y=0;y<RD;y++){
    var l=(x+y)%2===0;
    drawBlock(x,y,0,1,1,4,l?'#C9AD78':'#BFA070',l?'#B89868':'#A88858',l?'#B89868':'#A88858');
  }
  for(var x=0;x<RW;x++)drawBlock(x,RD,0,1,0.4,16,'#8A7A6A','#7A6A5A','#6A5A4A');
  for(var x=0;x<RW;x++)drawBlock(x,RD+0.3,12,1,0.3,8,'#5A8A3A','#4A7A2A','#3A6A1A');
}

function drawBackWalls(){
  drawBlock(0,0,0,RW,0.3,WALL_H,'#E8DCD0','#DDD0C0','#D0C4B4');
  drawBlock(0,0,0,0.3,RD,WALL_H,'#EDE3D5','#DDD0C0','#D0C4B4');
}
function drawFrontWalls(){
  drawBlock(RW-0.3,0,0,0.3,RD,WALL_H,'#E8DCD0','#D8CCBC','#C8BCA8');
}

function drawWindow(){
  var w=F.win;
  drawBlock(w.x,w.y,w.z,w.w,w.d,w.h,'#78B8E0','#6AADC8','#5A9DB8');
  drawBlock(w.x-0.1,w.y-0.1,w.z-6,w.w+0.2,0.1,w.h+12,'#6B5B45','#5A4A38','#4A3A2A');
  drawBlock(w.x+w.w/2-0.05,w.y-0.15,w.z,0.1,0.1,w.h,'#6B5B45','#5A4A38','#4A3A2A');
  drawBlock(w.x,w.y-0.15,w.z+w.h/2,w.w,0.1,0.1,'#6B5B45','#5A4A38','#4A3A2A');
}

function drawWhiteboard(){
  var wb=F.wb;
  drawBlock(wb.x,wb.y,wb.z,wb.w,wb.d,wb.h,'#F0F0E8','#E8E0D8','#E0D8D0');
  var s=toS(wb.x+0.5,wb.y-0.2,wb.z+80);g.fillStyle='#E85040';g.fillRect(s.x,s.y,40,4);
  s=toS(wb.x+0.5,wb.y-0.2,wb.z+60);g.fillStyle='#4088D8';g.fillRect(s.x,s.y,60,4);
  s=toS(wb.x+0.5,wb.y-0.2,wb.z+40);g.fillStyle='#50A050';g.fillRect(s.x,s.y,30,4);
}

function drawBookshelf(){
  var bs=F.bs;
  var img=imgCache['bookshelf'];
  if(img){
    var s=toS(bs.x+bs.w/2,bs.y+bs.d/2,bs.z);
    g.drawImage(img,s.x-img.width/2,s.y-img.height);
  }else{
    drawBlock(bs.x,bs.y,bs.z,bs.w,bs.d,bs.h,'#8A6C48','#745A3A','#6A5035');
  }
}

function drawDesk(d){
  drawBlock(d.x,d.y,d.z,d.w,d.d,6,'#BCA070','#A08058','#907048');
  drawBlock(d.x,d.y,d.z+6,d.w,d.d,d.h-8,'#A08058','#8A6C48','#7A5C38');
  drawBlock(d.x,d.y,d.z+d.h-2,d.w,d.d,4,'#CCAA78','#B89868','#A88858');
  drawBlock(d.x+0.5,d.y+0.3,d.z+d.h,1,0.1,36,'#222','#1A1A1A','#111');
  var ds=toS(d.x+0.6,d.y+0.35,d.z+d.h+4);
  var fl=.4+.3*Math.sin(Date.now()*.0015);
  g.fillStyle='rgba(80,180,120,'+fl*dayF()*.35+')';g.fillRect(ds.x,ds.y,36,24);
  drawBlock(d.x+0.3,d.y+1,d.z+d.h,0.8,0.4,2,'#444','#3A3A3A','#333');
}

function drawChair(c){
  drawBlock(c.x,c.y,c.z,0.8,0.8,6,'#4A4A4A','#3E3E3E','#363636');
  drawBlock(c.x+0.1,c.y+0.1,c.z+6,0.6,0.6,36,'#3E3E3E','#353535','#2E2E2E');
  drawBlock(c.x,c.y,c.z+42,0.8,0.1,30,'#444','#3A3A3A','#333');
}

function drawWaterCooler(){
  var wc=F.wc;
  drawBlock(wc.x,wc.y,wc.z,wc.w,wc.d,wc.h,'#DDD','#CCC','#BBB');
  drawBlock(wc.x+0.15,wc.y+0.1,wc.z+wc.h,0.7,0.7,40,'rgba(100,180,220,0.4)','rgba(80,160,200,0.3)','rgba(60,140,180,0.3)');
}

function drawCoffeeMachine(){
  var cf=F.cf;
  drawBlock(cf.x,cf.y,cf.z,cf.w,cf.d,cf.h,'#555','#444','#3A3A3A');
  drawBlock(cf.x+0.1,cf.y+0.1,cf.z+cf.h,cf.w-0.2,cf.d-0.2,10,'#666','#555','#4A4A4A');
  if(dayF()>.5){var s=toS(cf.x+cf.w/2,cf.y+cf.d/2,cf.z+cf.h+16);g.fillStyle='rgba(255,255,255,0.3)';var t=Date.now()*.003;for(var i=0;i<3;i++)g.fillRect(s.x+Math.sin(t+i)*6,s.y-i*8+Math.sin(t+i*.7)*4,4,4);}
}

function drawPlant(px,py,pz,big,wilt){
  var s=big?0.8:0.4;
  drawBlock(px,py,pz,s,s,s*24,'#A87858','#886040','#785030');
  if(wilt<.75){
    var n=Math.floor((1-wilt)*6)+2;var lc=wilt>.45?'#3D6835':'#5A8A48';
    for(var i=0;i<n;i++){var a=i/n*Math.PI*1.3-.4;var lx=px+s/2+Math.cos(a)*(0.3+i*0.15);var ly=py+s/2+Math.sin(a)*(0.2+i*0.1);var ls=toS(lx,ly,pz+s*24+10+i*16);g.fillStyle=lc;g.fillRect(ls.x-4,ls.y-6,10,8);}
  }else{var ls=toS(px+s/2,py+s/2,pz+s*24);g.fillStyle='#8B7355';g.fillRect(ls.x,ls.y-16,4,16);g.fillRect(ls.x+8,ls.y-12,4,12);}
}

function drawTrash(){var tr=F.tr;drawBlock(tr.x,tr.y,tr.z,0.5,0.5,30,'#555','#444','#3A3A3A');}

function drawBulletin(){
  var b=F.bul;drawBlock(b.x,b.y,b.z,b.w,b.d,b.h,'#A08058','#8A6C48','#7A5C38');
  var s=toS(b.x+0.3,b.y-0.2,b.z+20);
  g.fillStyle='#E85040';g.fillRect(s.x,s.y,12,16);g.fillStyle='#4088D8';g.fillRect(s.x+16,s.y,12,16);
  g.fillStyle='#50A050';g.fillRect(s.x,s.y+20,12,16);g.fillStyle='#E8B830';g.fillRect(s.x+16,s.y+20,12,16);
}

function drawClock(){
  var c=F.clk;var s=toS(c.x,c.y,c.z);
  g.fillStyle='#F0EDE8';g.beginPath();g.arc(s.x,s.y,20,0,Math.PI*2);g.fill();
  g.fillStyle='#DDD';g.beginPath();g.arc(s.x,s.y,16,0,Math.PI*2);g.fill();
  g.fillStyle='#333';g.font='14px monospace';g.textAlign='center';
  var t=new Date();g.fillText((t.getHours()%12)+':'+(t.getMinutes()<10?'0':'')+t.getMinutes(),s.x,s.y+6);
}

function drawPerson(p){
  var s=toS(p.x,p.y,p.z);
  g.fillStyle='rgba(0,0,0,0.08)';g.beginPath();g.ellipse(s.x,s.y+4,16,6,0,0,Math.PI*2);g.fill();
  g.fillStyle=p.hair;g.fillRect(s.x-8,s.y-56,16,10);
  g.fillStyle='#E8BA98';g.fillRect(s.x-6,s.y-46,12,10);
  g.fillStyle='#D0A480';g.fillRect(s.x-6,s.y-36,12,6);
  g.fillStyle=p.col;g.fillRect(s.x-8,s.y-30,16,20);
  g.fillStyle='rgba(255,255,255,0.12)';g.fillRect(s.x-8,s.y-30,16,4);
  if(p.st==='drink'&&p.cup){g.fillStyle=p.col;g.fillRect(s.x+p.dir*8,s.y-24,6,12);g.fillStyle='#F0E8E0';g.fillRect(s.x+p.dir*10,s.y-28,8,8);}
  else if(p.st==='water'){g.fillStyle=p.col;g.fillRect(s.x+p.dir*8,s.y-20,6,12);g.fillStyle='#888';g.fillRect(s.x+p.dir*12,s.y-12,10,6);}
  else{var sw=p.wf<2?0:2;g.fillStyle=p.col;g.fillRect(s.x-10,s.y-24+sw,6,12);g.fillRect(s.x+4,s.y-24-sw,6,12);}
  g.fillStyle='#484858';
  if(p.wf===0||p.wf===2){g.fillRect(s.x-6,s.y-10,6,14);g.fillRect(s.x+2,s.y-10,6,14);}
  else{g.fillRect(s.x-8,s.y-10,6,14);g.fillRect(s.x+4,s.y-10,6,14);}
  g.fillStyle='#333';g.fillRect(s.x-6,s.y+4,8,4);g.fillRect(s.x+2,s.y+4,8,4);
}

function drawGlassBox(){
  g.globalAlpha=0.12;
  // 后面板
  var p0=toS(0,RD,0),p1=toS(RW,RD,0),p2=toS(RW,RD,WALL_H),p3=toS(0,RD,WALL_H);
  g.fillStyle='#A0C8E0';g.beginPath();g.moveTo(p0.x,p0.y);g.lineTo(p1.x,p1.y);g.lineTo(p2.x,p2.y);g.lineTo(p3.x,p3.y);g.fill();
  // 左面板
  var q0=toS(0,0,0),q1=toS(0,RD,0),q2=toS(0,RD,WALL_H),q3=toS(0,0,WALL_H);
  g.beginPath();g.moveTo(q0.x,q0.y);g.lineTo(q1.x,q1.y);g.lineTo(q2.x,q2.y);g.lineTo(q3.x,q3.y);g.fill();
  // 右面板
  var r0=toS(RW,0,0),r1=toS(RW,RD,0),r2=toS(RW,RD,WALL_H),r3=toS(RW,0,WALL_H);
  g.beginPath();g.moveTo(r0.x,r0.y);g.lineTo(r1.x,r1.y);g.lineTo(r2.x,r2.y);g.lineTo(r3.x,r3.y);g.fill();
  // 前面板(底部可见边缘)
  var f0=toS(0,0,0),f1=toS(RW,0,0),f2=toS(RW,0,50),f3=toS(0,0,50);
  g.beginPath();g.moveTo(f0.x,f0.y);g.lineTo(f1.x,f1.y);g.lineTo(f2.x,f2.y);g.lineTo(f3.x,f3.y);g.fill();
  g.globalAlpha=1;
  g.strokeStyle='rgba(200,220,240,0.35)';g.lineWidth=2;
  g.beginPath();g.moveTo(p0.x,p0.y);g.lineTo(p1.x,p1.y);g.lineTo(p2.x,p2.y);g.lineTo(p3.x,p3.y);g.closePath();g.stroke();
  g.beginPath();g.moveTo(q0.x,q0.y);g.lineTo(q1.x,q1.y);g.lineTo(q2.x,q2.y);g.lineTo(q3.x,q3.y);g.closePath();g.stroke();
  g.beginPath();g.moveTo(r0.x,r0.y);g.lineTo(r1.x,r1.y);g.lineTo(r2.x,r2.y);g.lineTo(r3.x,r3.y);g.closePath();g.stroke();
  g.beginPath();g.moveTo(f0.x,f0.y);g.lineTo(f1.x,f1.y);g.lineTo(f2.x,f2.y);g.lineTo(f3.x,f3.y);g.closePath();g.stroke();
  // 提手
  var ht=toS(RW/2,0,WALL_H);
  g.strokeStyle='rgba(140,130,120,0.5)';g.lineWidth=3;g.beginPath();g.arc(ht.x,ht.y-16,24,Math.PI,0);g.stroke();
  g.strokeStyle='rgba(255,255,255,0.15)';g.lineWidth=2;g.beginPath();g.arc(ht.x,ht.y-16,24,Math.PI+.3,-.3);g.stroke();
}

function drawUI(){
  g.fillStyle='rgba(255,255,255,0.07)';g.font='20px monospace';g.textAlign='left';
  g.fillText('里面的工作不重要，别救它们。',40,H-40);
  var t=new Date();var ds=(t.getHours()<10?'0':'')+t.getHours()+':'+(t.getMinutes()<10?'0':'')+t.getMinutes();
  g.textAlign='right';g.font='28px monospace';g.fillStyle='rgba(255,255,255,0.16)';g.fillText(ds,W-40,60);
}

function drawAmbient(){
  var d=dayF();
  if(d<1){g.fillStyle='rgba(8,12,30,'+(1-d)*.25+')';g.fillRect(0,0,W,H);}
  if(hh>=17&&hh<20){g.fillStyle='rgba(255,140,40,0.03)';g.fillRect(0,0,W,H);}
}

function draw(){
  g.clearRect(0,0,W,H);g.fillStyle='#1a1510';g.fillRect(0,0,W,H);
  var tb0=toS(-1,-1,-2),tb1=toS(RW+1,-1,-2),tb2=toS(RW+1,RD+2,-2),tb3=toS(-1,RD+2,-2);
  g.fillStyle='#B89868';g.beginPath();g.moveTo(tb0.x,tb0.y);g.lineTo(tb1.x,tb1.y);g.lineTo(tb2.x,tb2.y);g.lineTo(tb3.x,tb3.y);g.fill();
  drawBackWalls();drawFloor();drawWindow();drawWhiteboard();drawBulletin();drawClock();
  drawBookshelf();drawDesk(F.dL);drawDesk(F.dR);drawChair(F.cL);drawChair(F.cR);
  drawWaterCooler();drawCoffeeMachine();
  drawPlant(F.pB.x,F.pB.y,F.pB.z,true,plant.wilt);
  drawPlant(F.pM.x,F.pM.y,F.pM.z,true,.5);
  drawPlant(F.pS1.x,F.pS1.y,F.pS1.z,false,.3);
  drawPlant(F.pS2.x,F.pS2.y,F.pS2.z,false,.6);
  drawTrash();
  var sorted=ppl.slice().sort(function(a,b){return(a.x+a.y)-(b.x+b.y);});
  for(var i=0;i<sorted.length;i++)drawPerson(sorted[i]);
  drawFrontWalls();drawGlassBox();drawUI();drawAmbient();
}

Promise.all([
  loadImg('bookshelf','assets/bookshelf.png')
]).then(function(){
  init();var lt=0;
  (function loop(t){var dt=lt?t-lt:16;lt=t;update(dt);draw();requestAnimationFrame(loop);})(0);
});
})();
