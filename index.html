<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>办公室生态缸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a06}
canvas{display:block;position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
var W=520,H=680;
cv.width=W;cv.height=H;
function fit(){var r=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*r)+'px';cv.style.height=Math.floor(H*r)+'px';cv.style.left=Math.floor((innerWidth-W*r)/2)+'px';cv.style.top=Math.floor((innerHeight-H*r)/2)+'px';}
fit();window.addEventListener('resize',fit);

var now=new Date(),hh=now.getHours();
function day(){return hh>=7&&hh<20?1:.25}
function dusk(){return hh>=17&&hh<20}

// === Palette ===
var C={
  // Floor
  f1:'#CBAD78',f2:'#B89968',f3:'#A58A58',f4:'#9A7F50',fgrain:'rgba(140,115,70,0.12)',
  // Wall
  w1:'#EDE3D5',w2:'#DDD0BE',w3:'#C8BCA8',wb:'#B5A998',
  // Wood
  wd1:'#A08058',wd2:'#8A6C48',wd3:'#745A3A',wdL:'#BCA070',wdLL:'#D0B880',
  // Metal
  m1:'#707070',m2:'#8A8A8A',m3:'#585858',m4:'#404040',
  // Skin
  sk:'#E8BA98',sd:'#D0A480',sl:'#F0C8A8',
  // Plants
  p1:'#5A8A48',p2:'#3D6835',p3:'#78A860',p4:'#4A7A3A',
  pot:'#A87858',potD:'#886040',soil:'#6B4A30',
  // Coffee
  cf:'#4A3020',cu:'#F0E8E0',cuD:'#D8D0C8',
  // Screen
  scr:'#1A2818',scrG:'rgba(80,180,120,0.35)',
  // Hat colors
  h0:'#E85040',h1:'#4088D8',h2:'#E8B830',h3:'#50A050',
  // Body colors (slightly different from hat)
  b0:'#D04838',b1:'#3878C0',b2:'#D0A028',b3:'#488A48',
  // Legs
  lg:'#484858',sh:'#333',
  // Sky
  sky1:'#78B8E0',sky2:'#A8D0F0',skyN1:'#081020',skyN2:'#182838',
  // Misc
  carpet:'#B89868',carpetD:'#A88858'
};

// === Room geometry ===
var BX=40,BY=55,BW=440,BH=510;
var RX=BX+18,RY=BY+42,RW=BX+BW-18,RH=BY+BH-20;
var FW=RY+140;

// === People ===
var ppl=[],plant={x:0,y:0,wilt:1,alive:false};

function init(){
  ppl=[
    {x:RX+80,y:FW+70,hc:C.h0,bc:C.b0,desk:{x:RX+35,y:FW+45},st:'idle',act:'cG',tm:4000+Math.random()*3000,wt:0,wf:0,d:1,cup:false,walkFrame:0},
    {x:RW-90,y:FW+150,hc:C.h1,bc:C.b1,desk:{x:RW-130,y:FW+115},st:'idle',act:'pG',tm:2500+Math.random()*2500,wt:0,wf:0,d:-1,cup:false,walkFrame:0},
    {x:RX+80,y:FW+170,hc:C.h2,bc:C.b2,desk:{x:RX+35,y:FW+140},st:'idle',act:'cG',tm:99999,wt:0,wf:0,d:1,cup:false,walkFrame:0},
    {x:RW-90,y:FW+55,hc:C.h3,bc:C.b3,desk:{x:RW-130,y:FW+25},st:'idle',act:'cG',tm:99999,wt:0,wf:0,d:-1,cup:false,walkFrame:0}
  ];
  plant={x:RX+18,y:FW+135,wilt:1,alive:false};
}

function tgt(p){
  var m={
    cG:{x:RW-55,y:RY+195},
    cB:{x:p.desk.x+35,y:p.desk.y-25},
    pG:{x:plant.x+18,y:plant.y-18},
    pB:{x:p.desk.x+35,y:p.desk.y-25}
  };
  return m[p.act]||{x:p.desk.x+35,y:p.desk.y-25};
}

function update(dt){
  for(var i=0;i<4;i++){
    var p=ppl[i];
    if(p.st==='walk'){
      var t=tgt(p),dx=t.x-p.x,dy=t.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<4){p.x=t.x;p.y=t.y;p.st='idle';p.tm=300+Math.random()*600;p.wt=0;}
      else{var sp=30;p.x+=dx/d*sp*dt/1000;p.y+=dy/d*sp*dt/1000;p.wt+=dt;if(p.wt>160){p.wt-=160;p.walkFrame=1-p.walkFrame;}}
      p.d=dx>0?1:-1;
    }else if(p.st==='idle'){
      p.tm-=dt;
      if(p.tm<=0){p.st='walk';p.wt=0;}
    }else if(p.st==='drink'){
      p.tm-=dt;
      if(p.tm<=0){p.cup=false;p.act='cB';p.st='walk';p.wt=0;}
      else if(p.tm<2000)p.cup=true;
    }else if(p.st==='water'){
      p.tm-=dt;
      if(p.tm<=0){plant.wilt=Math.max(.15,plant.wilt-.35);p.act='pB';p.st='walk';p.wt=0;}
    }
    var t2=tgt(p);p.d=t2.x>p.x?1:-1;
    var a=Math.abs(p.x-t2.x)<5&&Math.abs(p.y-t2.y)<5;
    if(a&&p.st==='walk'){
      if(p.act==='cG'){p.st='drink';p.tm=2600;p.cup=false;}
      else if(p.act==='cB'){p.st='idle';p.act='cG';p.tm=9000+Math.random()*10000;}
      else if(p.act==='pG'){p.st='water';p.tm=2600;}
      else if(p.act==='pB'){p.st='idle';p.act='pG';p.tm=7000+Math.random()*7000;}
    }
  }
  plant.wilt=Math.min(1,plant.wilt+dt*.000004);
  if(plant.wilt>=.97)plant.alive=false;
}

// === Drawing primitives ===
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w,h);}
function S(x,y,w,h,c,o){g.fillStyle='rgba(0,0,0,'+(o||0.07)+')';g.fillRect((x+2)|0,(y+2)|0,w,h);}

// === Floor ===
function drawFloor(){
  R(BX,FW,BW,BH+BY-FW,C.f1);
  for(var i=0;i<28;i++){
    R(BX,FW+i*17,BW,1,C.f2);
    if(i%3===0)R(BX+5,FW+i*17+3,BW-10,1,C.f3);
    if(i%5===0)R(BX+10,FW+i*17+7,BW-20,1,C.fgrain);
  }
  // Random wood grain
  for(var i=0;i<50;i++){
    var gx=BX+Math.random()*BW,gy=FW+Math.random()*(BH+BY-FW);
    R(gx,gy,Math.random()*30+8,1,C.fgrain);
  }
  // Carpet under desks
  g.globalAlpha=0.06;
  R(RX+10,FW+40,100,160,C.carpet);
  R(RW-140,FW+100,100,160,C.carpet);
  g.globalAlpha=1;
}

// === Wall ===
function drawWall(){
  R(BX,RY-8,BW,FW-RY+16,C.w1);
  R(BX,FW-2,BW,6,C.wb);
  // Wall texture lines
  for(var i=0;i<18;i++)R(BX+8+i*24,RY+4,16,1,'rgba(200,188,168,0.25)');
  // Baseboard shadow
  R(BX,FW-4,BW,2,'rgba(0,0,0,0.04)');
}

// === Window ===
function drawWindow(){
  var wx=BX+BW*.26,ww=BW*.48,wy=RY+3,wh=95;
  // Outer frame
  R(wx-5,wy-5,ww+10,wh+10,C.wd3);
  R(wx-3,wy-3,ww+6,wh+6,C.wd2);
  // Sky
  var sky=day()>.5;
  if(sky){
    var gr=g.createLinearGradient(wx,wy,wx+ww,wy+wh);
    gr.addColorStop(0,C.sky1);gr.addColorStop(1,C.sky2);
    g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
    // Clouds
    g.fillStyle='rgba(255,255,255,0.35)';
    R(wx+15,wy+12,30,8,'rgba(255,255,255,0.35)');
    R(wx+10,wy+16,20,6,'rgba(255,255,255,0.25)');
    R(wx+ww-55,wy+25,25,7,'rgba(255,255,255,0.3)');
    R(wx+ww-50,wy+29,18,5,'rgba(255,255,255,0.2)');
    // Distant trees/hills
    R(wx,wy+wh-20,ww,20,'rgba(80,130,70,0.3)');
    R(wx+10,wy+wh-25,15,25,'rgba(70,120,60,0.35)');
    R(wx+ww-30,wy+wh-22,12,22,'rgba(75,125,65,0.3)');
  }else{
    var gr=g.createLinearGradient(wx,wy,wx+ww,wy+wh);
    gr.addColorStop(0,C.skyN1);gr.addColorStop(1,C.skyN2);
    g.fillStyle=gr;g.fillRect(wx,wy,ww,wh);
    for(var i=0;i<6;i++)R(wx+12+i*22,wy+10+Math.sin(i*1.8)*18,2,2,'rgba(255,255,200,0.5)');
    // Moon
    g.fillStyle='rgba(255,255,220,0.6)';g.beginPath();g.arc(wx+ww-25,wy+18,8,0,Math.PI*2);g.fill();
    g.fillStyle=C.skyN1;g.beginPath();g.arc(wx+ww-22,wy+16,7,0,Math.PI*2);g.fill();
  }
  // Frame bars
  R(wx-1,wy,ww+2,3,C.wd2);R(wx-1,wy+wh-3,ww+2,3,C.wd2);
  R(wx,wy,3,wh,C.wd2);R(wx+ww-3,wy,3,wh,C.wd2);
  R(wx+ww/2-1,wy,2,wh,C.wd2);R(wx,wy+wh/2-1,ww,2,C.wd2);
  // Glass panes (subtle reflection)
  g.fillStyle='rgba(200,220,240,0.04)';
  g.fillRect(wx+3,wy+3,ww/2-5,wh/2-5);
  g.fillRect(wx+ww/2+2,wy+3,ww/2-5,wh/2-5);
  // Sill
  R(wx-7,wy+wh,ww+14,6,C.wd1);R(wx-7,wy+wh+6,ww+14,3,C.wd3);
  R(wx-7,wy+wh,ww+14,2,C.wdL);
  // Light beam
  if(sky){g.fillStyle='rgba(255,240,200,0.025)';g.beginPath();g.moveTo(wx+5,wy+wh);g.lineTo(wx+ww-5,wy+wh);g.lineTo(wx+ww+50,FW);g.lineTo(wx-30,FW);g.fill();}
}

// === Desk ===
function drawDesk(px,py){
  S(px,py,88,42);
  // Legs
  R(px+4,py+30,5,16,C.wd3);R(px+79,py+30,5,16,C.wd3);
  R(px+4,py+42,5,4,C.m4);R(px+79,py+42,5,4,C.m4);
  // Cross bar
  R(px+8,py+38,72,3,C.wd3);
  // Drawer unit
  R(px+58,py+12,28,20,C.wd1);R(px+58,py+12,28,3,C.wdL);
  R(px+60,py+17,24,2,C.m2);R(px+60,py+23,24,2,C.m2);
  R(px+60,py+29,24,2,C.m2);
  // Desktop surface
  R(px,py,88,14,C.wdL);R(px,py+12,88,3,C.wd1);
  R(px+1,py+1,86,2,C.wdLL);
  // Wood grain on desktop
  for(var i=0;i<6;i++)R(px+5+i*14,py+3,10,1,'rgba(160,128,72,0.15)');
  // Monitor
  R(px+14,py-24,34,26,'#222');R(px+16,py-22,30,20,C.scr);
  // Screen content
  var fl=.4+.3*Math.sin(Date.now()*.0015+px);
  g.fillStyle='rgba(80,180,120,'+fl*day()*.35+')';g.fillRect(px+17,py-21,28,18);
  // Code lines on screen
  for(var i=0;i<5;i++){
    var lw=8+Math.sin(i*1.3+Date.now()*.0008)*6;
    R(px+19,py-19+i*3,lw,1,'rgba(120,220,160,0.4)');
    if(i%2===0)R(px+19+lw+3,py-19+i*3,6,1,'rgba(200,120,100,0.3)');
  }
  // Monitor bezel highlight
  R(px+14,py-24,34,1,'rgba(255,255,255,0.08)');
  // Monitor stand
  R(px+28,py+2,5,5,C.m4);R(px+24,py+5,14,3,C.m3);
  // Keyboard
  R(px+12,py+5,24,5,'#4A4A4A');R(px+13,py+6,22,3,'#3A3A3A');
  // Key rows
  for(var i=0;i<3;i++)R(px+14,py+7+i,20,1,'rgba(60,60,60,0.5)');
  // Mouse
  R(px+40,py+6,6,5,'#555');R(px+41,py+7,4,3,'#444');
  // Small items on desk
  R(px+50,py+3,8,6,'#888'); // stapler?
  R(px+2,py+4,6,5,'rgba(100,150,200,0.4)'); // papers
}

// === Chair ===
function drawChair(px,py){
  S(px,py,24,32);
  // Wheels base
  R(px+4,py+28,4,5,C.m4);R(px+16,py+28,4,5,C.m4);R(px+9,py+30,6,4,C.m4);
  // Wheel dots
  R(px+5,py+32,2,2,'#222');R(px+17,py+32,2,2,'#222');R(px+11,py+33,3,2,'#222');
  // Seat
  R(px+2,py+16,20,10,'#4A4A4A');R(px+2,py+16,20,2,'#5A5A5A');
  // Seat cushion
  R(px+3,py+17,18,7,'#555');R(px+4,py+18,16,5,'#4E4E4E');
  // Backrest
  R(px+4,py+3,16,16,'#3E3E3E');R(px+4,py+3,16,2,'#4E4E4E');
  // Backrest detail
  R(px+5,py+6,14,10,'#454545');R(px+6,py+7,12,8,'#4A4A4A');
  // Armrests
  R(px-1,py+12,4,10,C.m3);R(px+21,py+12,4,10,C.m3);
  R(px-1,py+12,4,2,C.m2);R(px+21,py+12,4,2,C.m2);
}

// === Coffee Machine ===
function drawCoffee(px,py){
  S(px,py,32,46);
  // Main body
  R(px,py+4,32,42,C.m1);R(px+1,py+5,30,40,C.m2);
  // Top
  R(px-2,py,36,7,C.m3);R(px-2,py,36,3,C.m1);
  // Water tank (back)
  R(px+24,py+2,6,12,'rgba(100,160,200,0.3)');
  // Display
  R(px+5,py+10,22,10,'#1A1A1A');R(px+6,py+11,20,8,'#1A2A1A');
  // Display text
  R(px+8,py+13,8,2,'rgba(80,200,120,0.5)');
  R(px+8,py+17,12,1,'rgba(80,200,120,0.3)');
  // Buttons
  R(px+6,py+22,5,5,'#CC4444');R(px+6,py+22,5,1,'#DD6666');
  R(px+13,py+22,5,5,'#44AA44');R(px+13,py+22,5,1,'#66CC66');
  R(px+20,py+22,5,5,'#4488CC');R(px+20,py+22,5,1,'#66AAEE');
  // Dispenser area
  R(px+7,py+29,18,14,'#1A1A1A');R(px+8,py+30,16,12,'#111');
  // Nozzle
  R(px+13,py+29,6,4,C.m3);R(px+14,py+32,4,2,C.m4);
  // Cup
  R(px+11,py+36,10,8,C.cu);R(px+11,py+36,10,2,C.cuD);
  R(px+13,py+38,6,4,C.cf);
  // Cup handle
  R(px+21,py+38,3,4,C.cuD);
  // Drip tray
  R(px+7,py+42,18,3,C.m3);R(px+8,py+43,16,1,C.m4);
  // Steam
  if(day()>.5){
    var t=Date.now()*.003;
    g.fillStyle='rgba(255,255,255,0.35)';
    for(var i=0;i<4;i++){
      var sx=px+14+Math.sin(t*1.2+i*1.1)*2;
      var sy=py+32-i*5+Math.sin(t+i*.7)*2;
      g.fillRect(sx,sy,2,2);
    }
  }
}

// === Bookshelf ===
function drawBookshelf(px,py){
  S(px,py,48,78);
  R(px,py+2,48,76,C.wd1);R(px+1,py+3,46,74,C.wd2);
  // Shelves
  var books=['#A05030','#4068A0','#60A040','#C8A040','#8050A0','#D06040','#308080','#CC8844','#5588AA','#AA5577'];
  for(var i=0;i<4;i++){
    var sy=py+4+i*18;
    R(px+2,sy,44,3,C.wd1);R(px+2,sy,44,1,C.wdL);
    var bx=px+5;
    for(var j=0;j<6;j++){
      var bw=3+((i*7+j*3)%5);
      var bh=11+((i*5+j*7)%6);
      var bc=books[(i*3+j)%books.length];
      R(bx,sy+3-bh+14,bw,bh,bc);
      // Book spine highlight
      R(bx,sy+3-bh+14,1,bh,'rgba(255,255,255,0.1)');
      bx+=bw+1;
    }
  }
  // Top
  R(px-1,py,50,4,C.wdL);R(px-1,py,50,2,C.wdLL);
  // Items on top
  R(px+5,py-6,8,6,'#888'); // small box
  R(px+20,py-4,6,4,'#666'); // another item
}

// === Plant ===
function drawPlantP(px,py,w){
  S(px,py,28,34);
  // Pot
  R(px+5,py+20,18,14,C.pot);R(px+5,py+20,18,3,C.potD);
  R(px+3,py+18,22,4,C.pot);R(px+3,py+18,22,2,C.potD);
  // Pot rim highlight
  R(px+3,py+18,22,1,'rgba(255,255,255,0.1)');
  // Soil
  R(px+7,py+18,14,3,C.soil);
  // Drainage hole
  R(px+12,py+33,4,1,'#5A3A20');
  if(w<.75){
    var n=Math.floor((1-w)*7)+2;
    var lc=w>.45?C.p2:C.p1;
    var ll=w>.45?C.p4:C.p3;
    // Stem
    R(px+13,py+8,2,12,C.p2);
    // Leaves
    for(var i=0;i<n;i++){
      var a=i/n*Math.PI*1.4-.4;
      var lx=px+14+Math.cos(a)*(5+i*2.5);
      var ly=py+14+Math.sin(a)*(3+i*1.8)-i*1.5;
      R(lx,ly,5,4,lc);
      R(lx+1,ly-1,3,2,ll);
      R(lx+2,ly+2,2,1,C.p2);
    }
    // Flower (very rare)
    if(w<.3&&n>4){
      R(px+12,py+4,4,4,'#E880A0');R(px+13,py+3,2,2,'#F0A0B8');
    }
  }else{
    // Dead sticks
    R(px+12,py+6,2,14,'#8B7355');
    R(px+16,py+8,2,10,'#7A6548');
    R(px+10,py+10,2,7,'#8B7355');
    // Dry leaf on ground
    R(px+20,py+20,4,2,'rgba(160,130,80,0.4)');
  }
}

// === Person ===
function drawPerson(px,py,hc,bc,frame,dir,act,cup){
  var s=2;
  // Shadow
  g.fillStyle='rgba(0,0,0,0.09)';
  g.beginPath();g.ellipse(px,py+20*s,8*s,3*s,0,0,Math.PI*2);g.fill();
  // === Hat ===
  R(px-5*s,py-18*s,10*s,4*s,hc); // brim
  R(px-6*s,py-14*s,12*s,6*s,hc); // crown
  R(px-5*s,py-17*s,3*s,2*s,'rgba(255,255,255,0.18)'); // highlight
  R(px+3*s,py-13*s,2*s,3*s,'rgba(0,0,0,0.1)'); // shadow side
  // Hat band
  R(px-6*s,py-9*s,12*s,1*s,'rgba(0,0,0,0.15)');
  // === Head ===
  R(px-4*s,py-8*s,8*s,7*s,C.sk);
  R(px-4*s,py-1*s,8*s,3*s,C.sd);
  // Head highlight
  R(px-3*s,py-7*s,3*s,2*s,C.sl);
  // === Body ===
  R(px-5*s,py+2*s,10*s,8*s,bc);
  R(px-5*s,py+2*s,10*s,2*s,'rgba(255,255,255,0.12)');
  R(px-5*s,py+8*s,10*s,2*s,'rgba(0,0,0,0.08)');
  // Collar
  R(px-2*s,py+2*s,4*s,2*s,'rgba(255,255,255,0.15)');
  // === Arms ===
  if(act==='cG'&&cup){
    // Drinking: one arm up with cup
    R(px+dir*5*s,py-1*s,3*s,5*s,bc);
    R(px+dir*6*s,py-3*s,4*s,4*s,C.cu);
    R(px+dir*7*s,py-2*s,2*s,2*s,C.cf);
    R(px-dir*3*s,py+3*s,3*s,6*s,bc);
  }else if(act==='pG'){
    // Watering: arm extended with watering can
    R(px+dir*5*s,py+2*s,3*s,6*s,bc);
    R(px+dir*7*s,py+6*s,6*s,4*s,C.m2);
    R(px+dir*12*s,py+6*s,3*s,2*s,C.m3);
    // Water drops
    if(Math.random()>.25){
      for(var i=0;i<3;i++){
        g.fillStyle='rgba(100,180,220,0.5)';
        g.fillRect(px+dir*13*s,py+9*s+i*3*s+Math.random()*2,2,2);
      }
    }
    R(px-dir*3*s,py+3*s,3*s,5*s,bc);
  }else{
    // Arms at sides (walking swing)
    var swing=frame===0?0:2;
    R(px-6*s,py+3*s+swing,3*s,6*s,bc);
    R(px+3*s,py+3*s-swing,3*s,6*s,bc);
  }
  // === Legs ===
  if(frame===0){
    R(px-3*s,py+10*s,3*s,8*s,C.lg);
    R(px+1*s,py+10*s,3*s,8*s,C.lg);
  }else{
    R(px-4*s,py+10*s,3*s,8*s,C.lg);
    R(px+2*s,py+10*s,3*s,8*s,C.lg);
  }
  // Shoes
  R(px-4*s,py+17*s,4*s,2*s,C.sh);
  R(px+1*s,py+17*s,4*s,2*s,C.sh);
  // Shoe highlight
  R(px-3*s,py+17*s,2*s,1*s,'rgba(255,255,255,0.08)');
  R(px+2*s,py+17*s,2*s,1*s,'rgba(255,255,255,0.08)');
}

// === Glass box ===
function drawGlass(){
  g.strokeStyle='rgba(255,255,255,0.14)';g.lineWidth=2;g.strokeRect(BX,BY,BW,BH);
  g.strokeStyle='rgba(255,255,255,0.05)';g.lineWidth=1;g.strokeRect(BX+5,BY+5,BW-10,BH-10);
  // Reflections
  g.fillStyle='rgba(255,255,255,0.02)';g.fillRect(BX+8,BY+8,50,BH-16);
  g.fillStyle='rgba(255,255,255,0.012)';g.fillRect(BX+8,BY+8,BW-16,25);
  // Handle
  var hx=BX+BW/2;
  g.strokeStyle='rgba(140,130,120,0.45)';g.lineWidth=3;g.beginPath();g.arc(hx,BY-3,16,Math.PI,0);g.stroke();
  g.strokeStyle='rgba(255,255,255,0.12)';g.lineWidth=1;g.beginPath();g.arc(hx,BY-3,16,Math.PI+.3,-.3);g.stroke();
  // Handle mount
  R(hx-8,BY-2,4,4,C.m3);R(hx+4,BY-2,4,4,C.m3);
}

// === UI ===
function drawUI(){
  g.fillStyle='rgba(255,255,255,0.08)';g.font='10px monospace';g.textAlign='left';
  g.fillText('里面的工作不重要，别救它们。',BX+10,BY+BH+22);
  var t=new Date();
  var ds=(t.getHours()<10?'0':'')+t.getHours()+':'+(t.getMinutes()<10?'0':'')+t.getMinutes();
  g.textAlign='right';g.font='14px monospace';g.fillStyle='rgba(255,255,255,0.18)';
  g.fillText(ds,BX+BW-8,BY+26);
}

// === Ambient ===
function drawAmbient(){
  var d=day();
  if(d<1){g.fillStyle='rgba(8,12,30,'+(1-d)*.28+')';g.fillRect(0,0,W,H);}
  if(dusk()){g.fillStyle='rgba(255,140,40,0.035)';g.fillRect(0,0,W,H);}
  // Dust
  if(d>.5){g.fillStyle='rgba(255,240,200,0.12)';for(var i=0;i<6;i++){var dx=BX+30+Math.sin(Date.now()*.00025+i*1.9)*BW*.35;var dy=RY+40+Math.cos(Date.now()*.00018+i*2.3)*100+i*35;g.fillRect(dx,dy,1,1);}}
}

// === Main draw ===
function draw(){
  g.clearRect(0,0,W,H);
  g.fillStyle='#1a1510';g.fillRect(0,0,W,H);
  drawFloor();drawWall();drawWindow();
  // Furniture
  drawDesk(ppl[0].desk.x,ppl[0].desk.y);drawChair(ppl[0].desk.x+30,ppl[0].desk.y+22);
  drawDesk(ppl[2].desk.x,ppl[2].desk.y);drawChair(ppl[2].desk.x+30,ppl[2].desk.y+22);
  drawDesk(ppl[1].desk.x,ppl[1].desk.y);drawChair(ppl[1].desk.x-10,ppl[1].desk.y+22);
  drawDesk(ppl[3].desk.x,ppl[3].desk.y);drawChair(ppl[3].desk.x-10,ppl[3].desk.y+22);
  drawCoffee(RW-60,RY+168);
  drawBookshelf(RW-55,RY+12);
  drawPlantP(plant.x,plant.y,plant.wilt);
  // Sort people by Y
  var sorted=ppl.slice().sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];
    drawPerson(p.x,p.y,p.hc,p.bc,p.walkFrame,p.d,p.act,p.cup);
  }
  drawGlass();drawUI();drawAmbient();
}

init();
var lt=0;
(function loop(t){
  var dt=lt?t-lt:16;lt=t;
  update(dt);draw();
  requestAnimationFrame(loop);
})(0);
})();
</script>
</body>
</html>
