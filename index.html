<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>办公室生态缸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#2a2218;font-family:monospace;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');

var BOX={x:0,y:40,w:480,h:500};
var P=2;

function resize(){
  var s=Math.min(window.innerWidth/480,window.innerHeight/600);
  canvas.width=480;canvas.height=600;
  canvas.style.width=(480*s)+'px';canvas.style.height=(600*s)+'px';
  canvas.style.position='absolute';
  canvas.style.left=((window.innerWidth-480*s)/2)+'px';
  canvas.style.top=((window.innerHeight-600*s)/2)+'px';
  BOX.x=(480-BOX.w)/2;
}

var now=new Date();
var hh=now.getHours(),mm=now.getMinutes();
var timeAcc=0;

function dayFactor(){return hh>=7&&hh<20?1:0.25}
function isDusk(){return hh>=17&&hh<20}

var FL='#C4A67A',FD='#B09060',WL='#EDE3D5',WD='#D4C8B5';
var WT='#A09080',WF='#6B5B45';
var SKY_D1='#87CEEB',SKY_D2='#B0D8F0',SKY_N1='#0A1628',SKY_N2='#162840';
var DK='#A08060',DL='#BFA070',DM='#8B7355',DD='#6B5B45';
var HC=['#FF6B4A','#4A90D9','#F5C542','#6B8E5A'];
var DC=['#8B7355','#7A6548'];

var people=[];
var plant;

function init(){
  resize();
  var ib={x:BOX.x+16,y:BOX.y+32,w:BOX.w-32,h:BOX.h-48};
  var lx=ib.x+30,rx=ib.x+ib.w-80;
  var d1y=ib.y+ib.h*0.42,d2y=ib.y+ib.h*0.62;
  people=[
    {x:lx+20,y:d1y-22,hc:HC[0],hx:lx+20,hy:d1y-22,tx:lx+20,ty:d1y-22,
     state:'idle',timer:6000+Math.random()*4000,wt:0,wf:0,fd:1,
     desk:{x:lx,y:d1y},action:'coffee'},
    {x:rx+20,y:d2y-22,hc:HC[1],hx:rx+20,hy:d2y-22,tx:rx+20,ty:d2y-22,
     state:'idle',timer:4000+Math.random()*4000,wt:0,wf:0,fd:-1,
     desk:{x:rx,y:d2y},action:'plant'},
    {x:lx+20,y:d2y-22,hc:HC[2],hx:lx+20,hy:d2y-22,tx:lx+20,ty:d2y-22,
     state:'idle',timer:99999,wt:0,wf:0,fd:1,
     desk:{x:lx,y:d2y},action:'idle'},
    {x:rx+20,y:d1y-22,hc:HC[3],hx:rx+20,hy:d1y-22,tx:rx+20,ty:d1y-22,
     state:'idle',timer:99999,wt:0,wf:0,fd:-1,
     desk:{x:rx,y:d1y},action:'idle'}
  ];
  plant={x:ib.x+25,y:ib.y+ib.h*0.75,alive:true,wilt:1};
}

function targetPos(p){
  var ib={x:BOX.x+16,y:BOX.y+32,w:BOX.w-32,h:BOX.h-48};
  switch(p.action){
    case'coffee':return{x:ib.x+ib.w-50,y:ib.y+ib.h*0.35};
    case'coffeeBack':return{x:p.desk.x+20,y:p.desk.y-22};
    case'plant':return{x:plant.x+10,y:plant.y-10};
    case'plantBack':return{x:p.desk.x+20,y:p.desk.y-22};
    default:return{x:p.desk.x+20,y:p.desk.y-22};
  }
}

function update(dt){
  for(var i=0;i<people.length;i++){
    var p=people[i];
    if(p.state==='walk'){
      var t=targetPos(p);
      var dx=t.x-p.x,dy=t.y-p.y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<3){p.x=t.x;p.y=t.y;p.state='idle';p.timer=500+Math.random()*1500;p.wt=0;}
      else{var sp=25;p.x+=dx/d*sp*dt/1000;p.y+=dy/d*sp*dt/1000;p.wt+=dt;if(p.wt>200){p.wt-=200;p.wf=1-p.wf;}}
    }else if(p.state==='idle'){
      p.timer-=dt;
      if(p.timer<=0){
        if(p.action==='coffee')p.action='coffeeGo';
        else if(p.action==='coffeeBack')p.action='coffeeBackGo';
        else if(p.action==='plant')p.action='plantGo';
        else if(p.action==='plantBack')p.action='plantBackGo';
        p.state='walk';p.wt=0;
      }
    }else if(p.state==='drink'){
      p.timer-=dt;if(p.timer<=0){p.action='coffeeBackGo';p.state='walk';p.wt=0;}
    }else if(p.state==='water'){
      p.timer-=dt;
      if(p.timer<=0){
        if(plant.alive)plant.wilt=Math.max(0.25,plant.wilt-0.35);
        p.action='plantBackGo';p.state='walk';p.wt=0;
      }
    }
    var tgt=targetPos(p);
    if(p.action==='coffeeGo'){p.tx=tgt.x;p.ty=tgt.y;p.fd=p.tx>p.x?1:-1;}
    else if(p.action==='coffeeBackGo'){p.tx=tgt.x;p.ty=tgt.y;p.fd=p.tx>p.x?1:-1;}
    else if(p.action==='plantGo'){p.tx=tgt.x;p.ty=tgt.y;p.fd=p.tx>p.x?1:-1;}
    else if(p.action==='plantBackGo'){p.tx=tgt.x;p.ty=tgt.y;p.fd=p.tx>p.x?1:-1;}
    var arrived=Math.abs(p.x-p.tx)<3&&Math.abs(p.y-p.ty)<3;
    if(arrived){
      if(p.action==='coffeeGo'){p.state='drink';p.timer=3000;}
      else if(p.action==='coffeeBackGo'){p.state='idle';p.action='coffee';p.timer=12000+Math.random()*15000;}
      else if(p.action==='plantGo'){p.state='water';p.timer=3000;}
      else if(p.action==='plantBackGo'){p.state='idle';p.action='plant';p.timer=10000+Math.random()*10000;}
    }
  }
  if(!plant.alive)plant.wilt=Math.min(1,plant.wilt+dt*0.00002);
  else plant.wilt=Math.min(1,plant.wilt+dt*0.000008);
  if(plant.wilt>=1)plant.alive=false;
}

function drawPerson(x,y,hatC,frame,dir){
  var s=P;
  ctx.fillStyle='rgba(0,0,0,0.06)';
  ctx.beginPath();ctx.ellipse(x,y+16*s,5*s,2*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=hatC;
  ctx.fillRect(x-4*s,y-14*s,8*s,3*s);
  ctx.fillRect(x-5*s,y-11*s,10*s,4*s);
  ctx.fillStyle='#E8B89A';
  ctx.fillRect(x-3*s,y-7*s,6*s,5*s);
  ctx.fillStyle='#D4A080';
  ctx.fillRect(x-3*s,y-2*s,6*s,3*s);
  ctx.fillStyle=hatC;
  ctx.fillRect(x-4*s+dir*1*s,y+1*s,8*s,5*s);
  if(frame===0){ctx.fillRect(x-4*s,y+6*s,3*s,5*s);ctx.fillRect(x+1*s,y+6*s,3*s,5*s);}
  else{ctx.fillRect(x-5*s,y+6*s,3*s,5*s);ctx.fillRect(x+2*s,y+6*s,3*s,5*s);}
}

function drawDrinkAnim(x,y,hatC,progress,dir){
  drawPerson(x,y,hatC,0,dir);
  var s=P;
  var cupY=progress<0.15?y-2*s:(progress>0.85?y-2*s:y-8*s);
  ctx.fillStyle='#F8F4F0';
  ctx.fillRect(x+dir*5*s,cupY,4*s,4*s);
  ctx.fillStyle='#4A3525';
  ctx.fillRect(x+dir*5*s+1*s,cupY+1*s,2*s,2*s);
}

function drawWaterAnim(x,y,hatC,progress,dir){
  drawPerson(x,y,hatC,progress>0.5?1:0,dir);
  var s=P;
  if(progress>0.3){
    ctx.fillStyle='#5A8CA0';
    var wx=x+dir*6*s,wy=y+4*s;
    for(var j=0;j<3;j++){
      ctx.globalAlpha=0.5*(1-progress);
      ctx.fillRect(wx+Math.random()*4*s-2*s,wy+j*3*s,2*s,2*s);
    }
    ctx.globalAlpha=1;
  }
}

function drawFloor(){
  var ib={x:BOX.x+16,y:BOX.y+32,w:BOX.w-32,h:BOX.h-48};
  ctx.fillStyle=FL;ctx.fillRect(ib.x,ib.y+ib.h*0.22,ib.w,ib.h*0.78);
  ctx.fillStyle=FD;
  var fy=ib.y+ib.h*0.22;
  for(var r=0;r<21;r++){ctx.fillRect(ib.x,fy+r*18,ib.w,1);}
}

function drawWall(){
  var ib={x:BOX.x+16,y:BOX.y+32,w:BOX.w-32,h:BOX.h-48};
  ctx.fillStyle=WL;ctx.fillRect(ib.x,ib.y,ib.w,ib.h*0.24);
  ctx.fillStyle=WD;ctx.fillRect(ib.x,ib.y+ib.h*0.22,ib.w,ib.h*0.03);
  var wx=ib.x+ib.w*0.3,ww=ib.w*0.4,wh=ib.h*0.16,wy=ib.y+3;
  ctx.fillStyle=WF;ctx.fillRect(wx-3,wy-3,ww+6,wh+6);
  var sky=dayFactor()>0.5;
  if(sky){var g=ctx.createLinearGradient(wx,wy,wx,wy+wh);g.addColorStop(0,SKY_D1);g.addColorStop(1,SKY_D2);ctx.fillStyle=g;}
  else{var g=ctx.createLinearGradient(wx,wy,wx,wy+wh);g.addColorStop(0,SKY_N1);g.addColorStop(1,SKY_N2);ctx.fillStyle=g;}
  ctx.fillRect(wx,wy,ww,wh);
  ctx.fillStyle='#5A7A4A';
  for(var i=0;i<3;i++){var tw=ww*0.15,th=wh*0.3;ctx.fillRect(wx+5+i*(ww/3),wy+wh-th-2,tw,th);}
  ctx.fillStyle=WF;ctx.fillRect(wx+ww/2-1,wy,2,wh);ctx.fillRect(wx,wy+wh/2-1,ww,2);
  ctx.fillStyle='#B0C8D8';ctx.fillRect(wx+2,wy+2,ww/2-3,wh/2-3);
  ctx.fillStyle='#90B0C0';ctx.fillRect(wx+ww/2+1,wy+2,ww/2-3,wh/2-3);
  ctx.fillStyle=WT;ctx.fillRect(wx-2,wy+wh,ww+4,3);
}

function drawDesk(x,y){
  var s=P;
  ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(x+3*s,y+2*s,46*s,26*s);
  ctx.fillStyle=DM;ctx.fillRect(x,y+8*s,46*s,20*s);
  ctx.fillStyle=DD;ctx.fillRect(x+2*s,y+26*s,4*s,4*s);ctx.fillRect(x+40*s,y+26*s,4*s,4*s);
  ctx.fillStyle=DK;ctx.fillRect(x+2*s,y+4*s,42*s,5*s);
  ctx.fillStyle=DL;ctx.fillRect(x+2*s,y+1*s,42*s,4*s);
  ctx.fillStyle='#333';ctx.fillRect(x+14*s,y-8*s,18*s,10*s);
  ctx.fillStyle='#222';ctx.fillRect(x+15*s,y-7*s,16*s,8*s);
  var fl=0.5+0.5*Math.sin(Date.now()*0.003+x);
  ctx.fillStyle='rgba(100,200,150,'+fl*dayFactor()*0.4+')';ctx.fillRect(x+16*s,y-6*s,12*s,5*s);
  ctx.fillStyle='#555';ctx.fillRect(x+21*s,y+2*s,4*s,3*s);
}

function drawChair(x,y){
  var s=P;
  ctx.fillStyle='#666';ctx.fillRect(x+2*s,y+8*s,12*s,6*s);
  ctx.fillStyle='#888';ctx.fillRect(x+3*s,y+1*s,10*s,8*s);
}

function drawPlant(x,y,wilt){
  var s=P;
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(x+3*s,y+14*s,12*s,4*s);
  ctx.fillStyle='#8B6B4A';ctx.fillRect(x+1*s,y+10*s,14*s,8*s);
  ctx.fillStyle='#6B5040';ctx.fillRect(x+1*s,y+16*s,14*s,2*s);
  var gc=wilt>0.7?'#6B5540':wilt>0.4?'#7A8A40':'#5A8C4A';
  var gd=wilt>0.7?'#5A4530':wilt>0.4?'#5A6A30':'#3D6B35';
  ctx.fillStyle=gc;
  var n=Math.max(1,Math.floor((1-wilt)*5));
  for(var i=0;i<n;i++){
    var lx=x+4+Math.sin(i*2.5)*4,ly=y+2+Math.cos(i*1.8)*4;
    ctx.fillRect(lx*1,ly*1,3*s,3*s);
    ctx.fillStyle=gd;ctx.fillRect(lx*1+1,ly*1+1,1*s,1*s);ctx.fillStyle=gc;
  }
  if(n<=2){ctx.fillStyle='#8B7355';ctx.fillRect(x+7*s,y+5*s,2*s,5*s);}
}

function drawCoffee(x,y){
  var s=P;
  ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(x+3*s,y+2*s,14*s,22*s);
  ctx.fillStyle='#555';ctx.fillRect(x,y+4*s,14*s,18*s);
  ctx.fillStyle='#777';ctx.fillRect(x+1*s,y+5*s,12*s,8*s);
  ctx.fillStyle='#444';ctx.fillRect(x+2*s,y+6*s,10*s,6*s);
  ctx.fillStyle='#333';ctx.fillRect(x+4*s,y+1*s,6*s,4*s);
  ctx.fillStyle='#F8F4F0';ctx.fillRect(x+3*s,y+17*s,8*s,4*s);
  ctx.fillStyle='#E8E0D8';ctx.fillRect(x+2*s,y+20*s,10*s,2*s);
  if(dayFactor()>0.5){
    ctx.fillStyle='rgba(255,255,255,0.5)';
    var tt=Date.now()*0.002;
    for(var i=0;i<3;i++){
      var ty=y-2-i*3+Math.sin(tt+i*1.5)*2;
      ctx.fillRect(x+5+Math.sin(tt+i)*2,ty,2,2);
    }
  }
}

function drawBookshelf(x,y){
  var s=P;
  ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fillRect(x+3*s,y+2*s,30*s,46*s);
  ctx.fillStyle=DM;ctx.fillRect(x,y+2*s,30*s,44*s);
  ctx.fillStyle=DD;ctx.fillRect(x+1*s,y+1*s,28*s,2*s);
  for(var i=0;i<3;i++){
    ctx.fillStyle=DD;ctx.fillRect(x+1*s,y+2*s+i*14*s,28*s,1*s);
    ctx.fillStyle='#A05030';ctx.fillRect(x+4*s,y+4*s+i*14*s,4*s,10*s);
    ctx.fillStyle='#4A6A8A';ctx.fillRect(x+9*s,y+5*s+i*14*s,3*s,9*s);
    ctx.fillStyle='#6A8A4A';ctx.fillRect(x+13*s,y+4*s+i*14*s,5*s,10*s);
    ctx.fillStyle='#C8A040';ctx.fillRect(x+19*s,y+5*s+i*14*s,4*s,9*s);
    ctx.fillStyle='#8A5A6A';ctx.fillRect(x+24*s,y+4*s+i*14*s,3*s,10*s);
  }
}

function drawHandle(){
  var cx=BOX.x+BOX.w/2;
  ctx.strokeStyle='rgba(160,144,128,0.6)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,BOX.y+5,12,Math.PI,0);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(cx,BOX.y+5,12,Math.PI+0.3,-0.3);ctx.stroke();
}

function drawGlass(){
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;
  ctx.strokeRect(BOX.x,BOX.y,BOX.w,BOX.h);
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  ctx.strokeRect(BOX.x+4,BOX.y+4,BOX.w-8,BOX.h-8);
  ctx.fillStyle='rgba(255,255,255,0.03)';ctx.fillRect(BOX.x+8,BOX.y+8,60,BOX.h-16);
  drawHandle();
}

function drawInfo(){
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.font='10px monospace';ctx.textAlign='left';
  ctx.fillText('里面的工作不重要，别救它们。',BOX.x+12,BOX.y+BOX.h+18);
  var t=new Date();
  var ds=(t.getHours()<10?'0':'')+t.getHours()+':'+(t.getMinutes()<10?'0':'')+t.getMinutes();
  ctx.textAlign='right';ctx.font='13px monospace';ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillText(ds,BOX.x+BOX.w-8,BOX.y+22);
}

function drawAmbient(){
  var f=dayFactor();
  if(f<1){ctx.fillStyle='rgba(10,15,40,'+(1-f)*0.25+')';ctx.fillRect(0,0,480,600);}
  if(isDusk()){ctx.fillStyle='rgba(255,160,60,0.04)';ctx.fillRect(0,0,480,600);}
}

function draw(){
  ctx.clearRect(0,0,480,600);
  ctx.fillStyle='#2a2218';ctx.fillRect(0,0,480,600);
  drawFloor();drawWall();
  drawDesk(people[0].desk.x,people[0].desk.y);
  drawChair(people[0].desk.x+16,people[0].desk.y+28);
  drawDesk(people[2].desk.x,people[2].desk.y);
  drawChair(people[2].desk.x+16,people[2].desk.y+28);
  drawDesk(people[1].desk.x,people[1].desk.y);
  drawChair(people[1].desk.x-4,people[1].desk.y+28);
  drawDesk(people[3].desk.x,people[3].desk.y);
  drawChair(people[3].desk.x-4,people[3].desk.y+28);
  var ib={x:BOX.x+16,y:BOX.y+32,w:BOX.w-32,h:BOX.h-48};
  drawCoffee(ib.x+ib.w-42,ib.y+ib.h*0.28);
  drawBookshelf(ib.x+ib.w-36,ib.y+8);
  drawPlant(plant.x,plant.y,plant.wilt);
  var sorted=people.slice().sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];
    if(p.state==='drink'){var pr=1-p.timer/3000;drawDrinkAnim(p.x,p.y,p.hc,pr,p.fd);}
    else if(p.state==='water'){var pr=1-p.timer/3000;drawWaterAnim(p.x,p.y,p.hc,pr,p.fd);}
    else drawPerson(p.x,p.y,p.hc,p.wf,p.fd);
  }
  drawGlass();drawInfo();drawAmbient();
}

var lastT=0;
function loop(t){
  var dt=lastT?t-lastT:16;lastT=t;
  timeAcc+=dt;
  if(timeAcc>60000){timeAcc-=60000;now=new Date();hh=now.getHours();mm=now.getMinutes();}
  update(dt);draw();
  requestAnimationFrame(loop);
}

resize();init();requestAnimationFrame(loop);
window.addEventListener('resize',function(){resize();});
})();
</script>
</body>
</html>
