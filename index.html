<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>办公室生态缸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a06}
canvas{display:block;position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
var W=520,H=680;
cv.width=W;cv.height=H;
function fit(){var r=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*r)+'px';cv.style.height=Math.floor(H*r)+'px';cv.style.left=Math.floor((innerWidth-W*r)/2)+'px';cv.style.top=Math.floor((innerHeight-H*r)/2)+'px';}
fit();window.addEventListener('resize',fit);

// === Load spritesheets ===
var sheets={};var loaded=0;var total=6;
var sheetFiles={
  male:'assets/Gemini_Generated_Image_ieeq1qieeq1qieeq.jpg',
  multi:'assets/Gemini_Generated_Image_h6qo10h6qo10h6qo.jpg',
  furniture:'assets/Gemini_Generated_Image_er20qfer20qfer20.jpg',
  walls:'assets/Gemini_Generated_Image_5ov0f25ov0f25ov0.jpg',
  terrain:'assets/Gemini_Generated_Image_5fnc665fnc665fnc.jpg',
  scene:'assets/b3e1a6b9-22c2-46c6-968b-1c3ce53fb21f.jpg'
};

function onLoad(){loaded++;if(loaded>=total)start();}
for(var k in sheetFiles){
  (function(key){
    var img=new Image();
    img.onload=function(){sheets[key]=img;onLoad();};
    img.onerror=function(){loaded++;if(loaded>=total)start();};
    img.src=sheetFiles[key];
  })(k);
}

// === Sprite regions (x,y,w,h in source pixels) ===
// Male character sheet: 1376x768, 8 cols x 3 rows, cell ~172x256
var SP={
  // Male idle/walk (row 0: idle front/back/left/right, walk front 1-4)
  mIdleF:{s:'male',x:0,y:0,w:172,h:256},
  mIdleB:{s:'male',x:172,y:0,w:172,h:256},
  mIdleL:{s:'male',x:344,y:0,w:172,h:256},
  mIdleR:{s:'male',x:516,y:0,w:172,h:256},
  mWalkF1:{s:'male',x:688,y:0,w:172,h:256},
  mWalkF2:{s:'male',x:860,y:0,w:172,h:256},
  mWalkF3:{s:'male',x:1032,y:0,w:172,h:256},
  mWalkF4:{s:'male',x:1204,y:0,w:172,h:256},
  // Row 1: walk back 1-4, walk left 1-4
  mWalkB1:{s:'male',x:0,y:256,w:172,h:256},
  mWalkB2:{s:'male',x:172,y:256,w:172,h:256},
  mWalkB3:{s:'male',x:344,y:256,w:172,h:256},
  mWalkB4:{s:'male',x:516,y:256,w:172,h:256},
  mL1:{s:'male',x:688,y:256,w:172,h:256},
  mL2:{s:'male',x:860,y:256,w:172,h:256},
  mL3:{s:'male',x:1032,y:256,w:172,h:256},
  mL4:{s:'male',x:1204,y:256,w:172,h:256},
  // Row 2: walk right 1-4, and more
  mR1:{s:'male',x:0,y:512,w:172,h:256},
  mR2:{s:'male',x:172,y:512,w:172,h:256},
  mR3:{s:'male',x:344,y:512,w:172,h:256},
  mR4:{s:'male',x:516,y:512,w:172,h:256},

  // Multi-char sheet: 1408x768, 4 rows x 8 cols, cell ~176x192
  // Row 0: Office lady (blue blazer)
  fIdle:{s:'multi',x:0,y:0,w:176,h:192},
  fWalk1:{s:'multi',x:176,y:0,w:176,h:192},
  fWalk2:{s:'multi',x:352,y:0,w:176,h:192},
  fWalk3:{s:'multi',x:528,y:0,w:176,h:192},
  fWalk4:{s:'multi',x:704,y:0,w:176,h:192},
  fWalk5:{s:'multi',x:880,y:0,w:176,h:192},
  fSitDesk:{s:'multi',x:1056,y:0,w:176,h:192},
  fPrinter:{s:'multi',x:1232,y:0,w:176,h:192},
  // Row 1: Bearded man (green sweater)
  bIdle:{s:'multi',x:0,y:192,w:176,h:192},
  bWalk1:{s:'multi',x:176,y:192,w:176,h:192},
  bWalk2:{s:'multi',x:352,y:192,w:176,h:192},
  bWalk3:{s:'multi',x:528,y:192,w:176,h:192},
  bWalk4:{s:'multi',x:704,y:192,w:176,h:192},
  bWalk5:{s:'multi',x:880,y:192,w:176,h:192},
  bChart:{s:'multi',x:1056,y:192,w:176,h:192},
  bTalk:{s:'multi',x:1232,y:192,w:176,h:192},
  // Row 2: Woman with afro (plaid shirt)
  aIdle:{s:'multi',x:0,y:384,w:176,h:192},
  aWalk1:{s:'multi',x:176,y:384,w:176,h:192},
  aWalk2:{s:'multi',x:352,y:384,w:176,h:192},
  aWalk3:{s:'multi',x:528,y:384,w:176,h:192},
  aWalk4:{s:'multi',x:704,y:384,w:176,h:192},
  aWalk5:{s:'multi',x:880,y:384,w:176,h:192},
  aClipboard:{s:'multi',x:1056,y:384,w:176,h:192},
  aHolo:{s:'multi',x:1232,y:384,w:176,h:192},
  // Row 3: Scientist (lab coat)
  sIdle:{s:'multi',x:0,y:576,w:176,h:192},
  sWalk1:{s:'multi',x:176,y:576,w:176,h:192},
  sWalk2:{s:'multi',x:352,y:576,w:176,h:192},
  sWalk3:{s:'multi',x:528,y:576,w:176,h:192},
  sWalk4:{s:'multi',x:704,y:576,w:176,h:192},
  sWalk5:{s:'multi',x:880,y:576,w:176,h:192},
  sClipboard:{s:'multi',x:1056,y:576,w:176,h:192},
  sMicro:{s:'multi',x:1232,y:576,w:176,h:192},

  // Furniture sheet: 1408x768 - isometric furniture
  // These are approximate regions based on the sprite layout
  deskL:{s:'furniture',x:10,y:20,w:200,h:160},
  deskR:{s:'furniture',x:10,y:200,w:200,h:160},
  deskCorner:{s:'furniture',x:220,y:20,w:200,h:180},
  chair1:{s:'furniture',x:430,y:30,w:100,h:120},
  chair2:{s:'furniture',x:430,y:160,w:100,h:120},
  chair3:{s:'furniture',x:430,y:290,w:100,h:120},
  bookshelf:{s:'furniture',x:700,y:20,w:160,h:200},
  printer:{s:'furniture',x:550,y:200,w:140,h:140},
  computer:{s:'furniture',x:700,y:240,w:120,h:100},
  computerOld:{s:'furniture',x:550,y:360,w:120,h:100},
  waterCooler:{s:'furniture',x:350,y:400,w:80,h:160},
  coffeeMachine:{s:'furniture',x:850,y:360,w:100,h:120},
  plant1:{s:'furniture',x:1050,y:30,w:100,h:140},
  plant2:{s:'furniture',x:1050,y:180,w:100,h:140},
  plant3:{s:'furniture',x:1050,y:330,w:100,h:140},
  phone:{s:'furniture',x:850,y:500,w:60,h:60},
  bulletin:{s:'furniture',x:1200,y:20,w:120,h:140},
  clock:{s:'furniture',x:1320,y:20,w:60,h:60},
  whiteboard:{s:'furniture',x:1200,y:180,w:160,h:180},
  trash:{s:'furniture',x:350,y:580,w:60,h:80},
  trashBlue:{s:'furniture',x:420,y:580,w:60,h:80},

  // Wall tiles from walls sheet
  wallBack:{s:'walls',x:10,y:10,w:400,h:120},
  wallSide:{s:'walls',x:10,y:140,w:200,h:200},
  windowTile:{s:'walls',x:220,y:140,w:160,h:160},
  doorTile:{s:'walls',x:390,y:140,w:160,h:200},

  // Floor tiles
  floorWood:{s:'walls',x:500,y:400,w:200,h:200},
  floorCarpet:{s:'walls',x:710,y:400,w:200,h:200},

  // Terrarium glass panels
  glassTop:{s:'terrain',x:600,y:20,w:350,h:200},
  glassFront:{s:'terrain',x:600,y:240,w:350,h:200},
  glassSide:{s:'terrain',x:960,y:20,w:200,h:300},
  glassFrame:{s:'terrain',x:10,y:20,w:580,h:350},
  groundTiles:{s:'terrain',x:10,y:400,w:400,h:200},
};

// === Draw a sprite from spritesheet ===
function drawSprite(key,dx,dy,dw,dh){
  var r=SP[key];if(!r)return;
  var img=sheets[r.s];if(!img)return;
  g.drawImage(img,r.x,r.y,r.w,r.h,dx,dy,dw||r.w,dh||r.h);
}

// === Time ===
var now=new Date(),hh=now.getHours();
function day(){return hh>=7&&hh<20?1:.25}
function dusk(){return hh>=17&&hh<20}

// === Room geometry ===
var BX=30,BY=55,BW=460,BH=510;
var RX=BX+20,RY=BY+44,RW=BX+BW-20,RH=BY+BH-20;
var FW=RY+145;

// === People ===
var ppl=[],plant={x:0,y:0,wilt:1,alive:false};

function init(){
  ppl=[
    {x:RX+90,y:FW+65,chars:['mIdleR','mR1','mR2','mR3','mR4'],dir:1,
     desk:{x:RX+30,y:FW+40},st:'idle',act:'cG',tm:4000+Math.random()*3000,wt:0,wf:0,cup:false},
    {x:RW-100,y:FW+155,chars:['fIdle','fWalk1','fWalk2','fWalk3','fWalk4'],dir:-1,
     desk:{x:RW-140,y:FW+115},st:'idle',act:'pG',tm:2500+Math.random()*2500,wt:0,wf:0,cup:false},
    {x:RX+90,y:FW+175,chars:['bIdle','bWalk1','bWalk2','bWalk3','bWalk4'],dir:1,
     desk:{x:RX+30,y:FW+145},st:'idle',act:'cG',tm:99999,wt:0,wf:0,cup:false},
    {x:RW-100,y:FW+50,chars:['aIdle','aWalk1','aWalk2','aWalk3','aWalk4'],dir:-1,
     desk:{x:RW-140,y:FW+20},st:'idle',act:'cG',tm:99999,wt:0,wf:0,cup:false}
  ];
  plant={x:RX+12,y:FW+130,wilt:1,alive:false};
}

function tgt(p){
  var m={
    cG:{x:RW-60,y:RY+200},
    cB:{x:p.desk.x+40,y:p.desk.y-30},
    pG:{x:plant.x+20,y:plant.y-20},
    pB:{x:p.desk.x+40,y:p.desk.y-30}
  };
  return m[p.act]||{x:p.desk.x+40,y:p.desk.y-30};
}

function update(dt){
  for(var i=0;i<4;i++){
    var p=ppl[i];
    if(p.st==='walk'){
      var t=tgt(p),dx=t.x-p.x,dy=t.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<5){p.x=t.x;p.y=t.y;p.st='idle';p.tm=300+Math.random()*600;p.wt=0;}
      else{var sp=28;p.x+=dx/d*sp*dt/1000;p.y+=dy/d*sp*dt/1000;p.wt+=dt;if(p.wt>200){p.wt-=200;p.wf=(p.wf+1)%4;}}
      p.dir=dx>0?1:-1;
    }else if(p.st==='idle'){
      p.tm-=dt;
      if(p.tm<=0){p.st='walk';p.wt=0;}
    }else if(p.st==='drink'){
      p.tm-=dt;
      if(p.tm<=0){p.cup=false;p.act='cB';p.st='walk';p.wt=0;}
      else if(p.tm<1800)p.cup=true;
    }else if(p.st==='water'){
      p.tm-=dt;
      if(p.tm<=0){plant.wilt=Math.max(.15,plant.wilt-.35);p.act='pB';p.st='walk';p.wt=0;}
    }
    var t2=tgt(p);p.dir=t2.x>p.x?1:-1;
    var a=Math.abs(p.x-t2.x)<6&&Math.abs(p.y-t2.y)<6;
    if(a&&p.st==='walk'){
      if(p.act==='cG'){p.st='drink';p.tm=2600;p.cup=false;}
      else if(p.act==='cB'){p.st='idle';p.act='cG';p.tm=9000+Math.random()*10000;}
      else if(p.act==='pG'){p.st='water';p.tm=2600;}
      else if(p.act==='pB'){p.st='idle';p.act='pG';p.tm=7000+Math.random()*7000;}
    }
  }
  plant.wilt=Math.min(1,plant.wilt+dt*.000004);
  if(plant.wilt>=.97)plant.alive=false;
}

// === Drawing ===
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w,h);}

function drawScene(){
  // Background
  R(0,0,W,H,'#1a1510');

  // Draw the full scene image as background if loaded
  if(sheets.scene){
    g.drawImage(sheets.scene,0,0,1024,559,BX,BY,BW,BH);
  }

  // Floor
  if(sheets.walls){
    // Wood floor tiles
    for(var i=0;i<4;i++){
      for(var j=0;j<3;j++){
        g.drawImage(sheets.walls,500,400,200,200,RX+j*140,FW+i*80-20,140,80);
      }
    }
  }

  // Wall back
  if(sheets.walls){
    g.drawImage(sheets.walls,10,10,400,120,BX+10,RY-5,BW-20,100);
  }

  // Window on back wall
  if(sheets.walls){
    var sky=day()>.5;
    if(sky){
      g.drawImage(sheets.walls,220,140,160,160,BX+BW*.3,RY+5,140,90);
    }else{
      g.drawImage(sheets.walls,220,300,160,160,BX+BW*.3,RY+5,140,90);
    }
  }

  // Furniture
  if(sheets.furniture){
    // Desks
    g.drawImage(sheets.furniture,10,20,200,160,ppl[0].desk.x,ppl[0].desk.y,90,70);
    g.drawImage(sheets.furniture,10,200,200,160,ppl[2].desk.x,ppl[2].desk.y,90,70);
    g.drawImage(sheets.furniture,10,20,200,160,ppl[1].desk.x,ppl[1].desk.y,90,70);
    g.drawImage(sheets.furniture,10,200,200,160,ppl[3].desk.x,ppl[3].desk.y,90,70);

    // Chairs
    g.drawImage(sheets.furniture,430,30,100,120,ppl[0].desk.x+30,ppl[0].desk.y+25,40,50);
    g.drawImage(sheets.furniture,430,160,100,120,ppl[2].desk.x+30,ppl[2].desk.y+25,40,50);
    g.drawImage(sheets.furniture,430,290,100,120,ppl[1].desk.x-10,ppl[1].desk.y+25,40,50);
    g.drawImage(sheets.furniture,430,30,100,120,ppl[3].desk.x-10,ppl[3].desk.y+25,40,50);

    // Bookshelf
    g.drawImage(sheets.furniture,700,20,160,200,RW-60,RY+10,70,90);

    // Coffee machine
    g.drawImage(sheets.furniture,850,360,100,120,RW-65,RY+185,50,65);

    // Plants
    g.drawImage(sheets.furniture,1050,30,100,140,plant.x,plant.y-10,50,70);

    // Water cooler
    g.drawImage(sheets.furniture,350,400,80,160,RW-70,RY+130,35,70);

    // Whiteboard
    g.drawImage(sheets.furniture,1200,180,160,180,BX+BW*.4,RY+2,100,80);

    // Clock
    g.drawImage(sheets.furniture,1320,20,60,60,BX+BW*.75,RY+10,30,30);

    // Bulletin board
    g.drawImage(sheets.furniture,1200,20,120,140,BX+20,RY+10,60,70);

    // Trash
    g.drawImage(sheets.furniture,350,580,60,80,RX+5,FW+50,30,40);
  }

  // Characters
  var sorted=ppl.slice().sort(function(a,b){return a.y-b.y;});
  for(var i=0;i<sorted.length;i++){
    var p=sorted[i];
    var spriteKey;
    if(p.st==='walk'){
      spriteKey=p.chars[1+p.wf];
    }else if(p.st==='drink'&&p.cup){
      spriteKey=p.chars[0]; // idle for now, could use action sprite
    }else{
      spriteKey=p.chars[0];
    }
    // Draw character sprite
    drawSprite(spriteKey,p.x-40,p.y-60,80,100);

    // Draw cup if drinking
    if(p.cup){
      R(p.x+p.dir*15,p.y-15,8,8,'#F0E8E0');
      R(p.x+p.dir*16,p.y-13,6,3,'#4A3020');
    }
  }

  // Glass box overlay
  if(sheets.terrain){
    // Glass panels
    g.drawImage(sheets.terrain,600,20,350,200,BX-5,BY-5,BW+10,80);
    g.drawImage(sheets.terrain,960,20,200,300,BX+BW-40,BY,50,BH);
    g.drawImage(sheets.terrain,600,240,350,200,BX-5,BY+BH-40,BW+10,50);
  }

  // Glass frame
  g.strokeStyle='rgba(255,255,255,0.12)';g.lineWidth=2;
  g.strokeRect(BX,BY,BW,BH);
  g.strokeStyle='rgba(255,255,255,0.04)';g.lineWidth=1;
  g.strokeRect(BX+4,BY+4,BW-8,BH-8);

  // Glass reflections
  g.fillStyle='rgba(255,255,255,0.018)';
  g.fillRect(BX+6,BY+6,55,BH-12);
  g.fillStyle='rgba(255,255,255,0.01)';
  g.fillRect(BX+6,BY+6,BW-12,20);

  // Handle
  var hx=BX+BW/2;
  g.strokeStyle='rgba(140,130,120,0.4)';g.lineWidth=3;
  g.beginPath();g.arc(hx,BY-3,16,Math.PI,0);g.stroke();
  g.strokeStyle='rgba(255,255,255,0.1)';g.lineWidth=1;
  g.beginPath();g.arc(hx,BY-3,16,Math.PI+.3,-.3);g.stroke();
  R(hx-8,BY-2,4,4,'#555');R(hx+4,BY-2,4,4,'#555');

  // UI
  g.fillStyle='rgba(255,255,255,0.07)';g.font='10px monospace';g.textAlign='left';
  g.fillText('里面的工作不重要，别救它们。',BX+8,BY+BH+20);
  var t=new Date();
  var ds=(t.getHours()<10?'0':'')+t.getHours()+':'+(t.getMinutes()<10?'0':'')+t.getMinutes();
  g.textAlign='right';g.font='14px monospace';g.fillStyle='rgba(255,255,255,0.16)';
  g.fillText(ds,BX+BW-8,BY+24);

  // Ambient
  var d=day();
  if(d<1){g.fillStyle='rgba(8,12,30,'+(1-d)*.25+')';g.fillRect(0,0,W,H);}
  if(dusk()){g.fillStyle='rgba(255,140,40,0.03)';g.fillRect(0,0,W,H);}

  // Dust
  if(d>.5){g.fillStyle='rgba(255,240,200,0.1)';for(var i=0;i<5;i++){var dx=BX+30+Math.sin(Date.now()*.0002+i*1.7)*BW*.3;var dy=RY+40+Math.cos(Date.now()*.00015+i*2.1)*90+i*35;g.fillRect(dx,dy,1,1);}}
}

function start(){
  init();
  var lt=0;
  (function loop(t){
    var dt=lt?t-lt:16;lt=t;
    update(dt);drawScene();
    requestAnimationFrame(loop);
  })(0);
}

// Fallback if images fail to load
setTimeout(function(){if(loaded<total)start();},5000);
})();
</script>
</body>
</html>
